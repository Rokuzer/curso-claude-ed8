<div class="fade-in">
  <div class="page-header">
    <div class="header-back">
      <a [routerLink]="listUrl" class="back-link">
        <lucide-icon name="chevron-left" [size]="18"></lucide-icon>
      </a>
      <h1>{{ pageTitle }}</h1>
    </div>
  </div>

  @if (error()) {
    <div class="alert-error">{{ error() }}</div>
  }

  <form (ngSubmit)="onSubmit()" class="card form-card">
    <div class="form-grid">
      <div class="form-group">
        <label for="code">Código</label>
        <input id="code" type="text" class="form-control" name="code" required maxlength="40" placeholder="VERANO5"
          [ngModel]="form().code" (ngModelChange)="patch({ code: $event })" />
      </div>

      <div class="form-group">
        <label for="type">Tipo</label>
        <select id="type" class="form-control" name="type" required
          [ngModel]="form().type" (ngModelChange)="patch({ type: $event })">
          @for (t of types; track t) {
            <option [value]="t">{{ typeLabels[t] }}</option>
          }
        </select>
      </div>

      <div class="form-group">
        <label for="value">Valor</label>
        <input id="value" type="number" class="form-control" name="value" required min="0.01" step="0.01" [max]="valueMax()"
          [ngModel]="form().value" (ngModelChange)="patch({ value: $event })" />
      </div>

      <div class="form-group">
        <label for="maxUses">Usos máximos (opcional)</label>
        <input id="maxUses" type="number" class="form-control" name="maxUses" min="1" step="1" placeholder="Sin límite"
          [ngModel]="form().maxUses" (ngModelChange)="patch({ maxUses: $event })" />
      </div>

      <div class="form-group">
        <label for="expiresAt">Caduca el (opcional)</label>
        <input id="expiresAt" type="date" class="form-control" name="expiresAt"
          [ngModel]="form().expiresAt" (ngModelChange)="patch({ expiresAt: $event })" />
      </div>

      <div class="form-group">
        <label for="active">Estado</label>
        <label class="checkbox-label">
          <input id="active" type="checkbox" name="active"
            [ngModel]="form().active" (ngModelChange)="patch({ active: $event })" />
          Activo
        </label>
      </div>
    </div>

    <div class="form-actions">
      <a [routerLink]="listUrl" class="btn btn-secondary">Cancelar</a>
      <button type="submit" class="btn btn-primary" [disabled]="loading()">
        @if (loading()) {
          Guardando...
        } @else {
          Guardar
        }
      </button>
    </div>
  </form>
</div>
