openapi: 3.0.3
info:
  title: Resttek API
  version: 1.0.0
  description: |
    API REST de Resttek, plataforma de gestión de restaurantes.

    - Prefijo de todos los recursos: `/api/v1`. El healthcheck `/health` cuelga de la raíz.
    - Autenticación: JWT (8 h) obtenido en `/auth/login` o `/auth/register`, enviado como `Authorization: Bearer <token>`.
    - Roles: `admin`, `manager`, `camarero`, `cocinero`, `cliente`.
    - Los clientes son filas de `employees` con `role = cliente` y `restaurantId = null`; comparten los endpoints de auth.
    - Cada unidad pedida en un pedido se convierte en su propio `OrderItem` con `quantity: 1`.
    - Los errores de dominio (`AppError`) responden `{ error, message }`; los endpoints de pedidos y los middlewares de auth responden solo `{ error }`.
servers:
  - url: http://localhost:3000
    description: Desarrollo local
tags:
  - name: Sistema
  - name: Auth
  - name: Empleados
  - name: Restaurantes
  - name: Ingredientes
  - name: Platos
  - name: Mesas
  - name: Pedidos
  - name: Público
    description: Endpoints sin autenticación

paths:
  /health:
    get:
      tags: [Sistema]
      summary: Comprobación de estado
      operationId: getHealth
      security: []
      responses:
        '200':
          description: La API está en marcha
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Iniciar sesión
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Credenciales válidas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Credenciales inválidas (`InvalidCredentialsError`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainError'

  /api/v1/auth/register:
    post:
      tags: [Auth]
      summary: Registrar un cliente
      description: Crea un empleado con `role = cliente` y `restaurantId = null` y devuelve su token.
      operationId: registerClient
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Cliente creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Datos inválidos o email ya en uso (`DuplicatedEmailError`, `InvalidEmailError`, `FirstNameRequiredError`, ...)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainError'

  /api/v1/employees:
    get:
      tags: [Empleados]
      summary: Listar empleados (paginado)
      description: Solo `admin`.
      operationId: listEmployees
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
        - name: role
          in: query
          description: Filtra por rol
          schema:
            $ref: '#/components/schemas/Role'
      responses:
        '200':
          description: Lista de empleados
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Employee'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Empleados]
      summary: Crear un empleado
      description: Solo `admin`.
      operationId: createEmployee
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEmployeeRequest'
      responses:
        '201':
          description: Empleado creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Employee'
        '400':
          description: Datos inválidos, rol inválido o email ya en uso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/employees/{id}:
    get:
      tags: [Empleados]
      summary: Obtener un empleado
      description: Solo `admin`.
      operationId: getEmployee
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Empleado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Employee'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Empleado no encontrado (`EmployeeNotFoundError`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainError'

  /api/v1/restaurants/{restaurantId}/employees:
    get:
      tags: [Empleados]
      summary: Listar los empleados de un restaurante
      description: Solo `admin`.
      operationId: listRestaurantEmployees
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RestaurantId'
      responses:
        '200':
          description: Empleados del restaurante
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Employee'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/restaurants:
    get:
      tags: [Restaurantes]
      summary: Listar restaurantes
      description: |
        `admin` recibe todos los restaurantes; el resto de roles recibe solo el suyo
        (o `[]` si su token no tiene `restaurantId`).
      operationId: listRestaurants
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de restaurantes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Restaurant'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Restaurantes]
      summary: Crear un restaurante
      description: Solo `admin`.
      operationId: createRestaurant
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestaurantInput'
      responses:
        '201':
          description: Restaurante creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Restaurant'
        '400':
          description: Datos inválidos (nombre, dirección, email, teléfono o propietario)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/restaurants/{id}:
    get:
      tags: [Restaurantes]
      summary: Obtener un restaurante
      operationId: getRestaurant
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Restaurante
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Restaurant'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/RestaurantNotFound'
    put:
      tags: [Restaurantes]
      summary: Actualizar un restaurante
      description: Solo `admin`. Sustituye todos los campos.
      operationId: updateRestaurant
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestaurantInput'
      responses:
        '200':
          description: Restaurante actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Restaurant'
        '400':
          description: Datos inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/RestaurantNotFound'

  /api/v1/public/restaurants:
    get:
      tags: [Público]
      summary: Listar todos los restaurantes
      operationId: listPublicRestaurants
      security: []
      responses:
        '200':
          description: Lista de restaurantes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Restaurant'

  /api/v1/public/restaurants/{id}:
    get:
      tags: [Público]
      summary: Obtener un restaurante
      operationId: getPublicRestaurant
      security: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Restaurante
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Restaurant'
        '404':
          $ref: '#/components/responses/RestaurantNotFound'

  /api/v1/restaurants/{restaurantId}/ingredients:
    get:
      tags: [Ingredientes]
      summary: Listar los ingredientes de un restaurante
      description: Roles `admin`, `manager`, `cocinero`.
      operationId: listIngredients
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RestaurantId'
      responses:
        '200':
          description: Lista de ingredientes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Ingredient'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Ingredientes]
      summary: Crear un ingrediente
      description: Solo `admin`.
      operationId: createIngredient
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RestaurantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngredientCreateRequest'
      responses:
        '201':
          description: Ingrediente creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ingredient'
        '400':
          description: Nombre vacío, unidad inválida o stock negativo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/restaurants/{restaurantId}/ingredients/{id}:
    get:
      tags: [Ingredientes]
      summary: Obtener un ingrediente
      description: Roles `admin`, `manager`, `cocinero`.
      operationId: getIngredient
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RestaurantId'
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Ingrediente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ingredient'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/IngredientNotFound'
    put:
      tags: [Ingredientes]
      summary: Actualizar un ingrediente
      description: Solo `admin`.
      operationId: updateIngredient
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RestaurantId'
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngredientUpdateRequest'
      responses:
        '200':
          description: Ingrediente actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ingredient'
        '400':
          description: Nombre vacío, unidad inválida o stock negativo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/IngredientNotFound'
    delete:
      tags: [Ingredientes]
      summary: Eliminar un ingrediente
      description: Solo `admin`.
      operationId: deleteIngredient
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RestaurantId'
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Ingrediente eliminado
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/IngredientNotFound'

  /api/v1/restaurants/{restaurantId}/dishes:
    get:
      tags: [Platos]
      summary: Listar los platos de un restaurante
      description: Roles `admin`, `manager`, `camarero`, `cocinero`. Incluye platos no disponibles.
      operationId: listDishes
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RestaurantId'
      responses:
        '200':
          description: Lista de platos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Dish'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Platos]
      summary: Crear un plato
      description: Roles `admin`, `manager`.
      operationId: createDish
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RestaurantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DishCreateRequest'
      responses:
        '201':
          description: Plato creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dish'
        '400':
          description: Nombre vacío, precio no positivo, categoría inválida o ingrediente inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/restaurants/{restaurantId}/dishes/{id}:
    get:
      tags: [Platos]
      summary: Obtener un plato
      description: Roles `admin`, `manager`, `camarero`, `cocinero`.
      operationId: getDish
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RestaurantId'
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Plato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dish'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/DishNotFound'
    put:
      tags: [Platos]
      summary: Actualizar un plato
      description: Roles `admin`, `manager`. Sustituye todos los campos y la lista de ingredientes.
      operationId: updateDish
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RestaurantId'
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DishUpdateRequest'
      responses:
        '200':
          description: Plato actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dish'
        '400':
          description: Datos inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/DishNotFound'
    delete:
      tags: [Platos]
      summary: Eliminar un plato
      description: Roles `admin`, `manager`.
      operationId: deleteDish
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RestaurantId'
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Plato eliminado
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/DishNotFound'

  /api/v1/public/restaurants/{restaurantId}/dishes:
    get:
      tags: [Público]
      summary: Listar los platos disponibles de un restaurante
      description: Solo devuelve platos con `available = true`.
      operationId: listPublicDishes
      security: []
      parameters:
        - $ref: '#/components/parameters/RestaurantId'
      responses:
        '200':
          description: Platos disponibles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Dish'

  /api/v1/orders:
    post:
      tags: [Pedidos]
      summary: Crear un pedido
      description: |
        Cualquier usuario autenticado. El `clientId` se toma del token.
        Cada unidad de `quantity` genera un `OrderItem` independiente con `quantity: 1` y estado `pendiente`.
      operationId: createOrder
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderCreateRequest'
      responses:
        '201':
          description: Pedido creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          description: Datos inválidos (p. ej. `restaurantId` vacío, plato inexistente, mesa inexistente o no ocupada)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/orders/active:
    get:
      tags: [Pedidos]
      summary: Listar los pedidos activos de un restaurante
      description: Cualquier usuario autenticado.
      operationId: listActiveOrders
      security:
        - bearerAuth: []
      parameters:
        - name: restaurantId
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Pedidos activos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
        '400':
          description: Falta `restaurantId`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/orders/mine:
    get:
      tags: [Pedidos]
      summary: Listar los pedidos del usuario autenticado
      operationId: listMyOrders
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Pedidos del usuario
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/orders/{id}:
    get:
      tags: [Pedidos]
      summary: Obtener un pedido
      operationId: getOrder
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Pedido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Pedido no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleError'

  /api/v1/orders/{orderId}/items/{itemId}/status:
    patch:
      tags: [Pedidos]
      summary: Cambiar el estado de una unidad del pedido
      description: Flujo habitual `pendiente` → `preparando` → `listo` → `entregado`. Cualquier usuario autenticado.
      operationId: updateOrderItemStatus
      security:
        - bearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
        - name: itemId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  $ref: '#/components/schemas/OrderStatus'
      responses:
        '204':
          description: Estado actualizado
        '400':
          description: Pedido o unidad no encontrados, o estado inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/restaurants/{restaurantId}/tables:
    get:
      tags: [Mesas]
      summary: Listar las mesas de un restaurante
      description: Roles `admin`, `manager`, `camarero`, `cocinero`. Ordenadas por `number` ascendente. Filtro opcional por estado.
      operationId: listTables
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RestaurantId'
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/TableStatus'
      responses:
        '200':
          description: Mesas del restaurante
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Table'
        '400':
          $ref: '#/components/responses/TableDomainError400'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/RestaurantNotFound'
    post:
      tags: [Mesas]
      summary: Crear una mesa
      description: Roles `admin`, `manager`. La mesa nace `libre` salvo que se indique `status`.
      operationId: createTable
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RestaurantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TableInput'
      responses:
        '201':
          description: Mesa creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Table'
        '400':
          $ref: '#/components/responses/TableDomainError400'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/RestaurantNotFound'
        '409':
          $ref: '#/components/responses/DuplicatedTableNumber'

  /api/v1/restaurants/{restaurantId}/tables/{id}:
    get:
      tags: [Mesas]
      summary: Obtener una mesa
      description: Roles `admin`, `manager`, `camarero`, `cocinero`.
      operationId: getTable
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RestaurantId'
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Mesa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Table'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/TableNotFound'
    put:
      tags: [Mesas]
      summary: Actualizar una mesa
      description: Roles `admin`, `manager`. Sustituye `number`, `description` y `capacity`; `status` es opcional (si falta se conserva).
      operationId: updateTable
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RestaurantId'
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TableInput'
      responses:
        '200':
          description: Mesa actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Table'
        '400':
          $ref: '#/components/responses/TableDomainError400'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/TableNotFound'
        '409':
          $ref: '#/components/responses/DuplicatedTableNumber'
    delete:
      tags: [Mesas]
      summary: Eliminar una mesa
      description: Roles `admin`, `manager`. No se puede eliminar una mesa `ocupada` (409 `TableInUseError`).
      operationId: deleteTable
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RestaurantId'
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Mesa eliminada
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/TableNotFound'
        '409':
          description: La mesa está ocupada (`TableInUseError`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainError'

  /api/v1/restaurants/{restaurantId}/tables/{id}/status:
    patch:
      tags: [Mesas]
      summary: Cambiar el estado de una mesa
      description: |
        Roles `admin`, `manager`, `camarero`, `cocinero`. Fija `occupiedAt = ahora` al pasar a `ocupada`
        (si ya estaba `ocupada` no cambia) y `occupiedAt = null`, `occupiedBy = null` en cualquier otro estado.
        Liberar la mesa no modifica ni borra pedidos: se conservan en el historial (`/orders/mine`) pero dejan de aparecer en `.../orders` de la mesa.
      operationId: updateTableStatus
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RestaurantId'
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  $ref: '#/components/schemas/TableStatus'
      responses:
        '200':
          description: Mesa con el nuevo estado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Table'
        '400':
          description: Estado inválido (`InvalidTableStatusError`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/TableNotFound'

  /api/v1/restaurants/{restaurantId}/tables/{id}/orders:
    get:
      tags: [Mesas]
      summary: Pedidos de una mesa ocupada
      description: |
        Roles `admin`, `manager`, `camarero`, `cocinero`. Devuelve los pedidos con ese `tableId` creados desde
        `occupiedAt`, del más antiguo al más reciente, con sus `items` (estado por unidad). Si la mesa no está
        `ocupada` devuelve `[]`.
      operationId: listTableOrders
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RestaurantId'
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Pedidos de la ocupación actual
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/TableNotFound'

  /api/v1/restaurants/{restaurantId}/tables/{id}/occupy:
    post:
      tags: [Mesas]
      summary: Ocupar una mesa (cliente)
      description: |
        Rol `cliente`. Operación atómica (`UPDATE ... WHERE status = 'libre'`): marca la mesa `ocupada` y fija `occupiedAt`.
        Si otra persona la ocupó antes responde 409 y el cliente debe elegir otra mesa.
      operationId: occupyTable
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RestaurantId'
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [partySize]
              properties:
                partySize:
                  type: integer
                  minimum: 1
                  example: 4
      responses:
        '200':
          description: Mesa ocupada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Table'
        '400':
          description: '`partySize` inválido (`InvalidPartySizeError`) o mayor que la capacidad (`TableCapacityExceededError`)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/TableNotFound'
        '409':
          description: La mesa ya no está libre (`TableNotAvailableError`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainError'

  /api/v1/public/restaurants/{restaurantId}/tables:
    get:
      tags: [Público]
      summary: Mesas disponibles para un número de personas
      description: |
        Sin autenticación. Devuelve las mesas `libre` con `capacity >= partySize`, ordenadas por `capacity` y luego `number`
        ascendentes (la más ajustada primero). Sin `partySize` devuelve todas las libres.
      operationId: listPublicAvailableTables
      security: []
      parameters:
        - $ref: '#/components/parameters/RestaurantId'
        - name: partySize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Mesas disponibles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Table'
        '400':
          description: '`partySize` no es un entero >= 1 (`InvalidPartySizeError`)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainError'
        '404':
          $ref: '#/components/responses/RestaurantNotFound'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RestaurantId:
      name: restaurantId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    Unauthorized:
      description: Token ausente, malformado o inválido
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SimpleError'
          example:
            error: 'Unauthorized: No token provided'
    Forbidden:
      description: El rol del usuario no tiene permiso
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SimpleError'
          example:
            error: 'Forbidden: Insufficient permissions'
    RestaurantNotFound:
      description: Restaurante no encontrado (`RestaurantNotFoundError`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DomainError'
    IngredientNotFound:
      description: Ingrediente no encontrado (`IngredientNotFoundError`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DomainError'
    DishNotFound:
      description: Plato no encontrado (`DishNotFoundError`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DomainError'

    TableNotFound:
      description: Mesa no encontrada en ese restaurante (`TableNotFoundError`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DomainError'
    DuplicatedTableNumber:
      description: Ya existe una mesa con ese `number` en el restaurante (`DuplicatedTableNumberError`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DomainError'
    TableDomainError400:
      description: Datos inválidos (`InvalidTableNumberError`, `InvalidTableCapacityError`, `InvalidTableDescriptionError`, `InvalidTableStatusError`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DomainError'

  schemas:
    Role:
      type: string
      enum: [admin, manager, camarero, cocinero, cliente]
    IngredientUnit:
      type: string
      enum: [kg, g, l, ml, unidad]
    DishCategory:
      type: string
      enum: [entrante, principal, postre, bebida]
    OrderStatus:
      type: string
      enum: [pendiente, preparando, listo, entregado]
    DomainError:
      type: object
      description: Error de dominio traducido por el `errorHandler` (400 por defecto, 404 si no se encuentra, 401 si las credenciales son inválidas; 500 con `InternalServerError`).
      properties:
        error:
          type: string
          example: DuplicatedEmailError
        message:
          type: string
          example: Email is already in use
    SimpleError:
      type: object
      properties:
        error:
          type: string
          example: Unauthorized
    TableStatus:
      type: string
      enum: [libre, ocupada, reservada]
    Table:
      type: object
      required: [id, restaurantId, number, description, capacity, status, occupiedAt, occupiedBy]
      properties:
        id:
          type: string
          format: uuid
        restaurantId:
          type: string
          format: uuid
        number:
          type: integer
          minimum: 1
          example: 5
        description:
          type: string
          nullable: true
          example: Terraza junto a la ventana
        capacity:
          type: integer
          minimum: 1
          example: 4
        status:
          $ref: '#/components/schemas/TableStatus'
        occupiedAt:
          type: string
          format: date-time
          nullable: true
        occupiedBy:
          type: string
          format: uuid
          nullable: true
          description: Id del cliente que ocupó la mesa vía `/occupy`; null si la ocupó un empleado o no está ocupada.
    TableInput:
      type: object
      required: [number, capacity]
      properties:
        number:
          type: integer
          minimum: 1
        description:
          type: string
          nullable: true
        capacity:
          type: integer
          minimum: 1
        status:
          $ref: '#/components/schemas/TableStatus'
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: admin@resttek.com
        password:
          type: string
          format: password
    RegisterRequest:
      type: object
      required: [firstName, lastName, email, password]
      properties:
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    AuthResponse:
      type: object
      properties:
        token:
          type: string
          description: JWT con `id`, `role` y `restaurantId`; caduca en 8 h
        employee:
          $ref: '#/components/schemas/Employee'
    Employee:
      type: object
      properties:
        id:
          type: string
          format: uuid
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/Role'
        restaurantId:
          type: string
          format: uuid
          nullable: true
    CreateEmployeeRequest:
      type: object
      required: [firstName, lastName, email, password, role]
      properties:
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          format: password
        role:
          $ref: '#/components/schemas/Role'
        restaurantId:
          type: string
          format: uuid
          nullable: true
    Restaurant:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        address:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        ownerFirstName:
          type: string
        ownerLastName:
          type: string
        logoUrl:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    RestaurantInput:
      type: object
      required: [name, address, email, phone, ownerFirstName, ownerLastName]
      properties:
        name:
          type: string
        address:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
          description: 7-20 caracteres entre dígitos, espacios, `-`, `(`, `)` y `+` inicial opcional
          example: '+34 600 123 456'
        ownerFirstName:
          type: string
        ownerLastName:
          type: string
        logoUrl:
          type: string
          nullable: true
    Ingredient:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        unit:
          $ref: '#/components/schemas/IngredientUnit'
        currentStock:
          type: number
        restaurantId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    IngredientCreateRequest:
      type: object
      required: [name, unit]
      properties:
        name:
          type: string
        unit:
          $ref: '#/components/schemas/IngredientUnit'
        currentStock:
          type: number
          minimum: 0
          default: 0
    IngredientUpdateRequest:
      type: object
      required: [name, unit, currentStock]
      properties:
        name:
          type: string
        unit:
          $ref: '#/components/schemas/IngredientUnit'
        currentStock:
          type: number
          minimum: 0
    DishIngredient:
      type: object
      required: [ingredientId, quantity]
      properties:
        ingredientId:
          type: string
          format: uuid
        quantity:
          type: number
          exclusiveMinimum: true
          minimum: 0
    Dish:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        price:
          type: number
        category:
          $ref: '#/components/schemas/DishCategory'
        available:
          type: boolean
        restaurantId:
          type: string
          format: uuid
        ingredients:
          type: array
          items:
            $ref: '#/components/schemas/DishIngredient'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    DishCreateRequest:
      type: object
      required: [name, price, category]
      properties:
        name:
          type: string
        description:
          type: string
          nullable: true
        price:
          type: number
          exclusiveMinimum: true
          minimum: 0
        category:
          $ref: '#/components/schemas/DishCategory'
        available:
          type: boolean
          default: true
        ingredients:
          type: array
          default: []
          items:
            $ref: '#/components/schemas/DishIngredient'
    DishUpdateRequest:
      type: object
      required: [name, price, category, available]
      properties:
        name:
          type: string
        description:
          type: string
          nullable: true
        price:
          type: number
          exclusiveMinimum: true
          minimum: 0
        category:
          $ref: '#/components/schemas/DishCategory'
        available:
          type: boolean
        ingredients:
          type: array
          default: []
          items:
            $ref: '#/components/schemas/DishIngredient'
    OrderCreateRequest:
      type: object
      required: [restaurantId, items]
      properties:
        restaurantId:
          type: string
          format: uuid
        tableId:
          type: string
          nullable: true
          description: Si se envía, la mesa debe existir, ser del restaurante y estar `ocupada` (`TableNotFoundError` / `TableNotOccupiedError`, 400)
        items:
          type: array
          items:
            type: object
            required: [dishId, quantity]
            properties:
              dishId:
                type: string
                format: uuid
              quantity:
                type: integer
                minimum: 1
                description: Se expande en `quantity` unidades (`OrderItem`) independientes
              notes:
                type: string
                nullable: true
    OrderItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        dishId:
          type: string
          format: uuid
        quantity:
          type: integer
          enum: [1]
        notes:
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/OrderStatus'
        dishName:
          type: string
          description: Solo en las lecturas
        dishPrice:
          type: number
          description: Solo en las lecturas
        dishCategory:
          type: string
          description: Solo en las lecturas
    Order:
      type: object
      properties:
        id:
          type: string
          format: uuid
        restaurantId:
          type: string
          format: uuid
        tableId:
          type: string
          nullable: true
          description: Id de la mesa (`Table.id`); null si el pedido no es de mesa
        tableNumber:
          type: integer
          nullable: true
          description: Número de la mesa; null si no hay `tableId`
        clientId:
          type: string
          format: uuid
          nullable: true
        createdAt:
          type: string
          format: date-time
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
        restaurantName:
          type: string
          description: Solo en las lecturas
        restaurantLogoUrl:
          type: string
          nullable: true
          description: Solo en las lecturas
