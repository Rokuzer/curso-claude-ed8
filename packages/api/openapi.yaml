openapi: 3.0.3
info:
  title: Resttek API
  version: 1.0.0
  description: |
    API REST de Resttek, plataforma de gestión de restaurantes.

    - Prefijo de todos los recursos: `/api/v1`. El healthcheck `/health` cuelga de la raíz.
    - Autenticación: JWT (8 h) obtenido en `/auth/login` o `/auth/register`, enviado como `Authorization: Bearer <token>`.
    - Roles: `admin`, `manager`, `camarero`, `cocinero`, `cliente`.
    - Los clientes son filas de `employees` con `role = cliente` y `restaurantId = null`; comparten los endpoints de auth.
    - Cada unidad pedida en un pedido se convierte en su propio `OrderItem` con `quantity: 1`.
    - Los errores de dominio (`AppError`) responden `{ error, message }`; los endpoints de pedidos y los middlewares de auth responden solo `{ error }`.
servers:
  - url: http://localhost:3000
    description: Desarrollo local
tags:
  - name: Sistema
  - name: Auth
  - name: Empleados
  - name: Restaurantes
  - name: Ingredientes
  - name: Platos
  - name: Pedidos
  - name: Público
    description: Endpoints sin autenticación

paths:
  /health:
    get:
      tags: [Sistema]
      summary: Comprobación de estado
      operationId: getHealth
      security: []
      responses:
        '200':
          description: La API está en marcha
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Iniciar sesión
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Credenciales válidas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Credenciales inválidas (`InvalidCredentialsError`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainError'

  /api/v1/auth/register:
    post:
      tags: [Auth]
      summary: Registrar un cliente
      description: Crea un empleado con `role = cliente` y `restaurantId = null` y devuelve su token.
      operationId: registerClient
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Cliente creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Datos inválidos o email ya en uso (`DuplicatedEmailError`, `InvalidEmailError`, `FirstNameRequiredError`, ...)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainError'

  /api/v1/employees:
    get:
      tags: [Empleados]
      summary: Listar empleados (paginado)
      description: Solo `admin`.
      operationId: listEmployees
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
        - name: role
          in: query
          description: Filtra por rol
          schema:
            $ref: '#/components/schemas/Role'
      responses:
        '200':
          description: Lista de empleados
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Employee'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Empleados]
      summary: Crear un empleado
      description: Solo `admin`.
      operationId: createEmployee
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEmployeeRequest'
      responses:
        '201':
          description: Empleado creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Employee'
        '400':
          description: Datos inválidos, rol inválido o email ya en uso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/employees/{id}:
    get:
      tags: [Empleados]
      summary: Obtener un empleado
      description: Solo `admin`.
      operationId: getEmployee
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Empleado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Employee'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Empleado no encontrado (`EmployeeNotFoundError`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainError'

  /api/v1/restaurants/{restaurantId}/employees:
    get:
      tags: [Empleados]
      summary: Listar los empleados de un restaurante
      description: Solo `admin`.
      operationId: listRestaurantEmployees
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RestaurantId'
      responses:
        '200':
          description: Empleados del restaurante
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Employee'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/restaurants:
    get:
      tags: [Restaurantes]
      summary: Listar restaurantes
      description: |
        `admin` recibe todos los restaurantes; el resto de roles recibe solo el suyo
        (o `[]` si su token no tiene `restaurantId`).
      operationId: listRestaurants
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de restaurantes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Restaurant'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Restaurantes]
      summary: Crear un restaurante
      description: Solo `admin`.
      operationId: createRestaurant
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestaurantInput'
      responses:
        '201':
          description: Restaurante creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Restaurant'
        '400':
          description: Datos inválidos (nombre, dirección, email, teléfono o propietario)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/restaurants/{id}:
    get:
      tags: [Restaurantes]
      summary: Obtener un restaurante
      operationId: getRestaurant
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Restaurante
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Restaurant'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/RestaurantNotFound'
    put:
      tags: [Restaurantes]
      summary: Actualizar un restaurante
      description: Solo `admin`. Sustituye todos los campos.
      operationId: updateRestaurant
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestaurantInput'
      responses:
        '200':
          description: Restaurante actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Restaurant'
        '400':
          description: Datos inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/RestaurantNotFound'

  /api/v1/public/restaurants:
    get:
      tags: [Público]
      summary: Listar todos los restaurantes
      operationId: listPublicRestaurants
      security: []
      responses:
        '200':
          description: Lista de restaurantes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Restaurant'

  /api/v1/public/restaurants/{id}:
    get:
      tags: [Público]
      summary: Obtener un restaurante
      operationId: getPublicRestaurant
      security: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Restaurante
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Restaurant'
        '404':
          $ref: '#/components/responses/RestaurantNotFound'

  /api/v1/restaurants/{restaurantId}/ingredients:
    get:
      tags: [Ingredientes]
      summary: Listar los ingredientes de un restaurante
      description: Roles `admin`, `manager`, `cocinero`.
      operationId: listIngredients
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RestaurantId'
      responses:
        '200':
          description: Lista de ingredientes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Ingredient'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Ingredientes]
      summary: Crear un ingrediente
      description: Solo `admin`.
      operationId: createIngredient
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RestaurantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngredientCreateRequest'
      responses:
        '201':
          description: Ingrediente creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ingredient'
        '400':
          description: Nombre vacío, unidad inválida o stock negativo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/restaurants/{restaurantId}/ingredients/{id}:
    get:
      tags: [Ingredientes]
      summary: Obtener un ingrediente
      description: Roles `admin`, `manager`, `cocinero`.
      operationId: getIngredient
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RestaurantId'
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Ingrediente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ingredient'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/IngredientNotFound'
    put:
      tags: [Ingredientes]
      summary: Actualizar un ingrediente
      description: Solo `admin`.
      operationId: updateIngredient
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RestaurantId'
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngredientUpdateRequest'
      responses:
        '200':
          description: Ingrediente actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ingredient'
        '400':
          description: Nombre vacío, unidad inválida o stock negativo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/IngredientNotFound'
    delete:
      tags: [Ingredientes]
      summary: Eliminar un ingrediente
      description: Solo `admin`.
      operationId: deleteIngredient
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RestaurantId'
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Ingrediente eliminado
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/IngredientNotFound'

  /api/v1/restaurants/{restaurantId}/dishes:
    get:
      tags: [Platos]
      summary: Listar los platos de un restaurante
      description: Roles `admin`, `manager`, `camarero`, `cocinero`. Incluye platos no disponibles.
      operationId: listDishes
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RestaurantId'
      responses:
        '200':
          description: Lista de platos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Dish'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Platos]
      summary: Crear un plato
      description: Roles `admin`, `manager`.
      operationId: createDish
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RestaurantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DishCreateRequest'
      responses:
        '201':
          description: Plato creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dish'
        '400':
          description: Nombre vacío, precio no positivo, categoría inválida o ingrediente inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/restaurants/{restaurantId}/dishes/{id}:
    get:
      tags: [Platos]
      summary: Obtener un plato
      description: Roles `admin`, `manager`, `camarero`, `cocinero`.
      operationId: getDish
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RestaurantId'
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Plato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dish'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/DishNotFound'
    put:
      tags: [Platos]
      summary: Actualizar un plato
      description: Roles `admin`, `manager`. Sustituye todos los campos y la lista de ingredientes.
      operationId: updateDish
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RestaurantId'
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DishUpdateRequest'
      responses:
        '200':
          description: Plato actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dish'
        '400':
          description: Datos inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/DishNotFound'
    delete:
      tags: [Platos]
      summary: Eliminar un plato
      description: Roles `admin`, `manager`.
      operationId: deleteDish
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RestaurantId'
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Plato eliminado
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/DishNotFound'

  /api/v1/public/restaurants/{restaurantId}/dishes:
    get:
      tags: [Público]
      summary: Listar los platos disponibles de un restaurante
      description: Solo devuelve platos con `available = true`.
      operationId: listPublicDishes
      security: []
      parameters:
        - $ref: '#/components/parameters/RestaurantId'
      responses:
        '200':
          description: Platos disponibles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Dish'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RestaurantId:
      name: restaurantId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    Unauthorized:
      description: Token ausente, malformado o inválido
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SimpleError'
          example:
            error: 'Unauthorized: No token provided'
    Forbidden:
      description: El rol del usuario no tiene permiso
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SimpleError'
          example:
            error: 'Forbidden: Insufficient permissions'
    RestaurantNotFound:
      description: Restaurante no encontrado (`RestaurantNotFoundError`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DomainError'
    IngredientNotFound:
      description: Ingrediente no encontrado (`IngredientNotFoundError`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DomainError'
    DishNotFound:
      description: Plato no encontrado (`DishNotFoundError`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DomainError'

  schemas:
    Role:
      type: string
      enum: [admin, manager, camarero, cocinero, cliente]
    IngredientUnit:
      type: string
      enum: [kg, g, l, ml, unidad]
    DishCategory:
      type: string
      enum: [entrante, principal, postre, bebida]
    OrderStatus:
      type: string
      enum: [pendiente, preparando, listo, entregado]
    DomainError:
      type: object
      description: Error de dominio traducido por el `errorHandler` (400 por defecto, 404 si no se encuentra, 401 si las credenciales son inválidas; 500 con `InternalServerError`).
      properties:
        error:
          type: string
          example: DuplicatedEmailError
        message:
          type: string
          example: Email is already in use
    SimpleError:
      type: object
      properties:
        error:
          type: string
          example: Unauthorized
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: admin@resttek.com
        password:
          type: string
          format: password
    RegisterRequest:
      type: object
      required: [firstName, lastName, email, password]
      properties:
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    AuthResponse:
      type: object
      properties:
        token:
          type: string
          description: JWT con `id`, `role` y `restaurantId`; caduca en 8 h
        employee:
          $ref: '#/components/schemas/Employee'
    Employee:
      type: object
      properties:
        id:
          type: string
          format: uuid
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/Role'
        restaurantId:
          type: string
          format: uuid
          nullable: true
    CreateEmployeeRequest:
      type: object
      required: [firstName, lastName, email, password, role]
      properties:
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          format: password
        role:
          $ref: '#/components/schemas/Role'
        restaurantId:
          type: string
          format: uuid
          nullable: true
    Restaurant:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        address:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        ownerFirstName:
          type: string
        ownerLastName:
          type: string
        logoUrl:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    RestaurantInput:
      type: object
      required: [name, address, email, phone, ownerFirstName, ownerLastName]
      properties:
        name:
          type: string
        address:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
          description: 7-20 caracteres entre dígitos, espacios, `-`, `(`, `)` y `+` inicial opcional
          example: '+34 600 123 456'
        ownerFirstName:
          type: string
        ownerLastName:
          type: string
        logoUrl:
          type: string
          nullable: true
    Ingredient:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        unit:
          $ref: '#/components/schemas/IngredientUnit'
        currentStock:
          type: number
        restaurantId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    IngredientCreateRequest:
      type: object
      required: [name, unit]
      properties:
        name:
          type: string
        unit:
          $ref: '#/components/schemas/IngredientUnit'
        currentStock:
          type: number
          minimum: 0
          default: 0
    IngredientUpdateRequest:
      type: object
      required: [name, unit, currentStock]
      properties:
        name:
          type: string
        unit:
          $ref: '#/components/schemas/IngredientUnit'
        currentStock:
          type: number
          minimum: 0
    DishIngredient:
      type: object
      required: [ingredientId, quantity]
      properties:
        ingredientId:
          type: string
          format: uuid
        quantity:
          type: number
          exclusiveMinimum: true
          minimum: 0
    Dish:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        price:
          type: number
        category:
          $ref: '#/components/schemas/DishCategory'
        available:
          type: boolean
        restaurantId:
          type: string
          format: uuid
        ingredients:
          type: array
          items:
            $ref: '#/components/schemas/DishIngredient'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    DishCreateRequest:
      type: object
      required: [name, price, category]
      properties:
        name:
          type: string
        description:
